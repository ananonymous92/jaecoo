<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAECOO Admin Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <script type="module" crossorigin src="/assets/admin-BoPCFe25.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/apiClient-lyAnOTD-.js">
  <link rel="modulepreload" crossorigin href="/assets/vendor-icons-BJpMaZcN.js">
  <link rel="stylesheet" crossorigin href="/assets/admin-rRzmfeKk.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h2 class="brand">JAECOO <span>Admin</span></h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;">
        Masuk ke panel administrasi website
      </p>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="login-username" class="form-control" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" required autocomplete="current-password">
        </div>
        <div id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display:none;"></div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Login</button>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard (hidden until login) -->
  <div id="admin-app" class="admin-container" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2 class="brand">JAECOO <span>Admin</span></h2>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Links will be injected by admin.js -->
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-outline btn-full">Logout</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumbs" id="breadcrumbs">
          <span>Dashboard</span> / <strong id="current-page-title">Overview</strong>
        </div>
        <div class="user-profile">
          <span class="user-name">Admin User</span>
          <div class="avatar">A</div>
        </div>
      </header>

      <div class="content-area" id="content-area">
        <!-- Dashboard views will be injected here -->
      </div>
    </main>
  </div>

</body>
</html>
